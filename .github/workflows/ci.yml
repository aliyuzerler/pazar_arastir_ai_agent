name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint / Tip Kontrolü / Test / Build / E2E
    runs-on: ubuntu-latest
    env:
      DB_DRIVER: pglite
      PG_LITE_DATA_DIR: ./.pglite-ci-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Birim + entegrasyon testleri (pglite)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Playwright kurulumu
        run: npx playwright install --with-deps chromium

      - name: E2E testleri
        run: npm run test:e2e

      - name: Test raporlarını yükle (hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
