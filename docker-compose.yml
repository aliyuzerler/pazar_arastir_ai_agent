services:
  postgres:
    image: postgres:17-alpine
    container_name: product-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_intelligence
      POSTGRES_USER: productintel
      POSTGRES_PASSWORD: productintel_local_password
    ports:
      - "5432:5432"
    volumes:
      - product_intelligence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productintel -d product_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  product_intelligence_pgdata:
